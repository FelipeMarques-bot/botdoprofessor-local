name: CI - Validacao de Codigo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Verificar sintaxe (AST)
        run: |
          python -c "
          import ast, os, sys
          errors = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.venv', 'build_venv', '.git', '__pycache__', 'build', 'dist', 'node_modules', '.github', '.ruff_cache', '.pytest_cache')]
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      try:
                          with open(path, encoding='utf-8-sig') as fh:
                              ast.parse(fh.read())
                      except SyntaxError as e:
                          errors.append(f'{path}: {e}')
          if errors:
              for e in errors:
                  print(e)
              sys.exit(1)
          print('Todos os arquivos .py compilam com sucesso.')
          "

      - name: Lint com Ruff (erros críticos)
        run: |
          ruff check --select E9,F63,F7,F82 --line-length=160 .

      - name: Lint com Ruff (avisos)
        continue-on-error: true
        run: |
          ruff check --ignore=E501 --line-length=160 .

      - name: Testes unitarios/integracao (API + utilitarios)
        run: |
          python -m pytest tests/test_all.py tests/test_e2e.py tests/test_revocation.py tests/test_status_store.py -q --disable-warnings

      - name: Testar geracao de templates
        run: |
          python -c "
          import tempfile, os, sys
          sys.path.insert(0, '.')
          from leitor_planilhas import (
              gerar_template_notas_xlsx, gerar_template_notas_csv,
              gerar_template_sequencias_xlsx, gerar_template_sequencias_csv,
              ler_sequencias_excel, ler_sequencias_csv,
          )
          for name, fn, ext in [
              ('notas.xlsx', gerar_template_notas_xlsx, '.xlsx'),
              ('notas.csv', gerar_template_notas_csv, '.csv'),
              ('seq.xlsx', gerar_template_sequencias_xlsx, '.xlsx'),
              ('seq.csv', gerar_template_sequencias_csv, '.csv'),
          ]:
              data = fn()
              tmp = tempfile.NamedTemporaryFile(suffix=ext, delete=False)
              if ext == '.csv':
                  tmp.close()
                  with open(tmp.name, 'w', encoding='utf-8') as f:
                      f.write(data)
              else:
                  tmp.write(data)
                  tmp.close()

              reader = None
              if 'seq' in name and ext == '.xlsx':
                  reader = ler_sequencias_excel
              elif 'seq' in name and ext == '.csv':
                  reader = ler_sequencias_csv
              if reader:
                  r = reader(tmp.name)
                  assert len(r) > 0, f'{name}: leitura retornou vazio'
              os.unlink(tmp.name)
              print(f'{name}: OK ({len(data)} bytes)')
          print('Todos os templates gerados e lidos com sucesso.')
          "
