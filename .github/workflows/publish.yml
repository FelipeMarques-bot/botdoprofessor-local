name: Publicar BotDoProfessor (Build one-dir + NSIS + R2 + Release)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao manual (ex: 1.4.42). Deixe vazio para auto-incrementar patch."
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "lancar_*.py"
      - "autofix.py"
      - "ai_assist.py"
      - "status_store.py"
      - "interpretar_pedido.py"
      - "leitor_planilhas.py"
      - "painel.py"
      - "launcher.py"
      - "app.py"
      - "requirements*.txt"
      - "BotDoProfessor.spec"
      - "installer.nsi"
      - "VERSION.txt"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller boto3

      - name: Calcular nova versao
        id: version
        shell: python
        run: |
          import os
          from pathlib import Path

          current = Path("VERSION.txt").read_text(encoding="utf-8").strip()
          manual = "${{ github.event.inputs.version }}".strip()

          if manual:
              new_ver = manual
          else:
              parts = current.split(".")
              if len(parts) == 3:
                  parts[2] = str(int(parts[2]) + 1)
              new_ver = ".".join(parts)

          Path("VERSION.txt").write_text(new_ver, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"old={current}\n")
              f.write(f"new={new_ver}\n")

          print(f"Versao: {current} -> {new_ver}")

      - name: Gerar app one-dir (PyInstaller via spec)
        run: python -m PyInstaller --noconfirm --clean BotDoProfessor.spec

      - name: Verificar app
        shell: bash
        run: |
          if [ ! -f dist/BotDoProfessor/BotDoProfessor.exe ]; then
            echo "ERRO: exe one-dir nao gerado"
            exit 1
          fi
          echo "Tamanho: $(wc -c < dist/BotDoProfessor/BotDoProfessor.exe) bytes"

      - name: Sincronizar versao do instalador
        shell: bash
        run: |
          sed -i "s/!define APP_VERSION \"[^\"]*\"/!define APP_VERSION \"${{ steps.version.outputs.new }}\"/" installer.nsi
          grep "APP_VERSION" installer.nsi

      - name: Instalar NSIS
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
            echo "NSIS instalado"
          } else {
            echo "ERRO: makensis nao encontrado apos instalacao"
            exit 1
          }

      - name: Gerar instalador NSIS
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          if (-not (Test-Path "dist\BotDoProfessor-Setup-v${{ steps.version.outputs.new }}.exe")) {
            echo "ERRO: Setup nao gerado"
            exit 1
          }
          echo "Setup gerado"

      - name: Validar secrets de storage
        shell: bash
        env:
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
        run: |
          errors=0
          if [ -z "$STORAGE_ENDPOINT" ] || [[ "$STORAGE_ENDPOINT" == *"<account>"* ]]; then
            echo "ERRO: STORAGE_ENDPOINT invalido ou placeholder"
            echo "  Valor atual: '${STORAGE_ENDPOINT:0:20}...'"
            echo "  Formato esperado: https://<ID>.r2.cloudflarestorage.com"
            errors=1
          fi
          if [ -z "$STORAGE_ACCESS_KEY" ]; then
            echo "ERRO: STORAGE_ACCESS_KEY vazio"
            errors=1
          fi
          if [ -z "$STORAGE_SECRET_KEY" ]; then
            echo "ERRO: STORAGE_SECRET_KEY vazio"
            errors=1
          fi
          if [ -z "$STORAGE_BUCKET" ]; then
            echo "ERRO: STORAGE_BUCKET vazio"
            errors=1
          fi
          if [ $errors -ne 0 ]; then
            echo ""
            echo "Configure os secrets em: GitHub > Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Secrets de storage OK (${STORAGE_ENDPOINT:0:30}...)"

      - name: Enviar instalador ao Cloudflare R2
        env:
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_OBJECT: ${{ secrets.STORAGE_OBJECT || 'BotDoProfessor.exe' }}
          STORAGE_VERSION_OBJECT: ${{ secrets.STORAGE_VERSION_OBJECT || 'version.json' }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION || 'auto' }}
        run: python upload_binario.py "dist\BotDoProfessor-Setup-v${{ steps.version.outputs.new }}.exe"

      - name: Commit versao no repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt installer.nsi
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${{ steps.version.outputs.new }} [skip ci]"
            git push
            echo "Version bumped and pushed."
          else
            echo "Nenhuma alteracao no VERSION.txt."
          fi

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: BotDoProfessor v${{ steps.version.outputs.new }}
          body: |
            ## v${{ steps.version.outputs.new }}

            **Download:** o instalador é baixado automaticamente pelo launcher na próxima abertura.

            ### Como atualizar
            - Clientes com v1.4.57+: atualização automática silenciosa (instalador NSIS `/S`)
            - Clientes anteriores: podem haver prompts de confirmação na primeira transição
          files: dist/BotDoProfessor-Setup-v${{ steps.version.outputs.new }}.exe
          draft: false
          prerelease: false
