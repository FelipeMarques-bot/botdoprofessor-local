zada uma pesquisa dirigida no laboratório de informática com o objetivo de dar continuidade ao planejamento do Projeto Mostra da Marvel. Os alunos pesquisaram referências sobre os personagens, histórias, cenários e elementos visuais que poderão ser utilizados na elaboração dos trabalhos, além de organizar as ideias para a construção de cada equipe. A atividade também possibilitou a definição das etapas de desenvolvimento do projeto e a distribuição inicial das responsabilidades entre os integrantes dos grupos.\n\nDurante a pesquisa, os estudantes realizaram um levantamento detalhado dos materiais necessários para a confecção dos trabalhos, considerando os recursos que serão utilizados na produção de maquetes, histórias em quadrinhos, cartazes, painéis, objetos decorativos e demais produções previstas para a mostra. Além disso, foram incentivados a buscar alternativas sustentáveis, reutilizando materiais recicláveis e de baixo custo, promovendo a criatividade e a consciência ambiental.\n\nA atividade teve como foco desenvolver a capacidade de planejamento, organização, trabalho em equipe e pesquisa, permitindo que os alunos fundamentassem suas escolhas com informações confiáveis e estruturassem o cronograma de execução do projeto. Ao final da aula, cada grupo apresentou uma prévia de suas propostas, relacionando os materiais necessários e as etapas que deverão ser realizadas nas próximas aulas para a produção e finalização dos trabalhos que serão expostos na Mostra da Marvel.\n","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","24/07/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","Em virtude da véspera do recesso escolar, foi realizada uma atividade diferenciada com a exibição de um filme da Marvel, utilizado como estudo de caso para o Projeto Integrador. Durante a sessão, os alunos foram orientados a observar aspectos relacionados ao trabalho em equipe, liderança, comunicação, resolução de conflitos, planejamento estratégico, tomada de decisões, inovação e gestão de pessoas. A atividade teve como objetivo proporcionar uma aprendizagem significativa por meio da análise crítica das ações e comportamentos dos personagens, estabelecendo relações entre o conteúdo do filme e os conceitos trabalhados nas disciplinas envolvidas no projeto. As observações realizadas servirão como base para discussões e atividades práticas que serão desenvolvidas após o período de recesso.\n","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","21/07/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","Jogos inter-classe\n\n\n\nElabore um texto dissertativo de 20 a 30 linhas, relacionando os conceitos de Gestão de Pessoas com o desempenho de uma equipe de futebol durante uma competição.","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","17/07/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","Continuação: Durante a aula da disciplina de Marketing, foi realizada a exibição do filme Homem-Aranha 2, como parte do Projeto Integrador Marvel. A atividade teve como objetivo analisar estratégias de construção de marca (branding), posicionamento, identidade do personagem, relacionamento com o público e influência da imagem na sociedade. A partir da narrativa, os estudantes foram incentivados a refletir sobre aspectos do marketing, como comunicação, reputação, valor da marca, tomada de decisão e comportamento do consumidor, estabelecendo conexões entre os conceitos teóricos e situações apresentadas no filme. A atividade promoveu a participação, o pensamento crítico e a aplicação prática dos conteúdos da disciplina.","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","14/07/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","Os estudantes deverão realizar uma análise crítica sobre o desempenho do trabalho em equipe dos jogadores durante a Copa, relacionando os acontecimentos observados com os conceitos estudados na disciplina de Gestão de Pessoas. A atividade deverá abordar aspectos como liderança, comunicação, motivação, cooperação, gestão de conflitos, tomada de decisão, competências comportamentais e trabalho em equipe, identificando os fatores que contribuíram para o desempenho da equipe.","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","11/07/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","FESTA JUNINA-DIA LETIVO","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","10/07/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","Entregar dia 14/07/2026   Gestão de pessoas.\n\nAtividade – Gestão de Pessoas: Trabalho em Equipe no Futebol\nTema: Análise do trabalho em equipe e da liderança no desempenho dos jogadores durante a Copa.\nObjetivo:\nAnalisar como os conceitos de Gestão de Pessoas influenciam o desempenho de uma equipe esportiva, identificando fatores que contribuíram ou dificultaram o sucesso da equipe.\nOrientações\nApós assistir aos jogos da Copa e considerando os conhecimentos adquiridos na disciplina de Gestão de Pessoas, elabore uma análise respondendo às questões abaixo.\nObservação: Não basta responder \"sim\" ou \"não\". Todas as respostas devem ser fundamentadas utilizando conceitos estudados na disciplina, como liderança, comunicação, motivação, trabalho em equipe, gestão de conflitos, competências, inteligência emocional e clima organizacional. \nQuestões\n    1. Como você avalia o trabalho em equipe apresentado pelos jogadores? Justifique sua resposta com exemplos observados durante os jogos. \n    2. Quais fatores podem ter impedido a equipe de alcançar melhores resultados? \n    3. A liderança do treinador e dos capitães foi eficiente? Explique quais atitudes demonstraram uma boa liderança ou quais aspectos poderiam ser melhorados. \n    4. A comunicação entre os jogadores pareceu eficiente? Cite situações que demonstram uma boa ou má comunicação dentro da equipe. \n    5. De que forma a motivação influencia o desempenho de uma equipe esportiva? Você acredita que os jogadores estavam motivados? Justifique. \n    6. Como a gestão de conflitos pode interferir no desempenho de uma equipe? Houve indícios de conflitos ou falta de integração? \n    7. Quais competências comportamentais você considera essenciais para uma equipe de alto desempenho? Cite pelo menos cinco e explique sua importância. \n    8. Se você fosse o gestor de pessoas dessa equipe, quais ações desenvolveria para melhorar o desempenho coletivo nas próximas competições?\n\n\n","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","07/07/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","Entregar dia 14/07/2026   Gestão de pessoas.\n\nAtividade – Gestão de Pessoas: Trabalho em Equipe no Futebol\nTema: Análise do trabalho em equipe e da liderança no desempenho dos jogadores durante a Copa.\nObjetivo:\nAnalisar como os conceitos de Gestão de Pessoas influenciam o desempenho de uma equipe esportiva, identificando fatores que contribuíram ou dificultaram o sucesso da equipe.\nOrientações\nApós assistir aos jogos da Copa e considerando os conhecimentos adquiridos na disciplina de Gestão de Pessoas, elabore uma análise respondendo às questões abaixo.\nObservação: Não basta responder \"sim\" ou \"não\". Todas as respostas devem ser fundamentadas utilizando conceitos estudados na disciplina, como liderança, comunicação, motivação, trabalho em equipe, gestão de conflitos, competências, inteligência emocional e clima organizacional. \nQuestões\n    1. Como você avalia o trabalho em equipe apresentado pelos jogadores? Justifique sua resposta com exemplos observados durante os jogos. \n    2. Quais fatores podem ter impedido a equipe de alcançar melhores resultados? \n    3. A liderança do treinador e dos capitães foi eficiente? Explique quais atitudes demonstraram uma boa liderança ou quais aspectos poderiam ser melhorados. \n    4. A comunicação entre os jogadores pareceu eficiente? Cite situações que demonstram uma boa ou má comunicação dentro da equipe. \n    5. De que forma a motivação influencia o desempenho de uma equipe esportiva? Você acredita que os jogadores estavam motivados? Justifique. \n    6. Como a gestão de conflitos pode interferir no desempenho de uma equipe? Houve indícios de conflitos ou falta de integração? \n    7. Quais competências comportamentais você considera essenciais para uma equipe de alto desempenho? Cite pelo menos cinco e explique sua importância. \n    8. Se você fosse o gestor de pessoas dessa equipe, quais ações desenvolveria para melhorar o desempenho coletivo nas próximas competições?\n\n\n","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","30/06/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","Continuação da parte teórica P1.\nA CHEGADA AO CINEMA\nO grande salto da Marvel aconteceu em 2008 com o lançamento do filme HOMEM DE FERRO, estrelado por Robert Downey Jr.\nO sucesso do filme levou á criação do UNIVERSO CINEMATOGRÁFICO MARVEL (MCU), um projeto inovador que conecta vários filmes em uma única história.\nEssa estratégia permitiu que personagens diferentes aparecessem juntos em produções como:\n* os vingadores\n* vingadores: Era de Ultron\n* vingadores: Guerra infinita\n* vingadores: Ultimato\nO modelo foi um grande sucesso e influenciou toda a indústria cinematográfica.\n\nA MARVEL E O MARKETING\nA Marvel é considerada um excelente exemplo de marketing e gestão de marca. Algumas estratégias utilizadas pela empresa incluem:\nIdentidade visual forte\nO logotipo vermelho com letras brancas é facilmente reconhecido em qualquer lugar do mundo.\nLICENCIAMENTO DE PRODUTOS: a MARCA AUTORIZA EMPRESAS PARCEIRAS A UTILIZAREM SEUS PERSONAGENS EM DIVERSOS PRODUTOS. \nExperiência do consumidor: Os fãs não apenas assistem aos filmes, mas também colecionam produtos, participam de eventos e acompanham séries e quadrinhos. \nPresença digital: A Marvel utiliza redes sociais, plataformas de streaming e campanhas publicitárias para manter o contato com seu público.\nA compra pela Disney: Em 2009, a Marvel foi adquirida pela THE WALT DISNEY COMPANY.\nA parceria trouxe ainda mais recursos para a produção de filmes, séries e novos projetos, ampliando a presença da marca em todo o mundo.\nA importância cultural da Marvel: Os personagens da Marvel ultrapassaram o universo dos quadrinhos e passaram influenciar;\n * Moda\n* cinema\n* publicidade\n* jogos\n* brinquedos\n* eventos culturais\n* redes sociais.\nHoje, heróis como Homem-Aranha, Capitão América e Homem de Ferro são reconhecidos por pessoas de diferentes idades e nacionalidades.\n\nConclusão.\nA Marvel é um exemplo de como uma empresa pode transformar criativa em uma marca global de sucesso. Desde sua fundação em 1939 até os dias atuais, a empresa evoluiu de uma pequena editora de quadrinhos para uma das maiores produtoras de entretenimento do planeta.\nSeu sucesso está relacionado á capacidade de criar personagens marcantes, contar histórias envolventes e desenvolver estratégias de marketing que fortalecem a relação entre a marca  e seus fãs.\n\n\n","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","26/06/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","Durante a aula, foi realizada a exibição do filme **Vingadores: Guerra Infinita**, como parte do Projeto Integrador desenvolvido nas disciplinas de Empreendedorismo, Marketing, Gestão de Pessoas e Gestão da Qualidade. A atividade teve como objetivo proporcionar aos estudantes a observação e análise de aspectos relacionados ao trabalho em equipe, liderança, planejamento estratégico, tomada de decisões, gestão de conflitos, comunicação, inovação e definição de objetivos comuns. Após a exibição, os alunos foram orientados a refletir sobre as competências e estratégias apresentadas pelos personagens, estabelecendo relações entre os conteúdos das disciplinas e sua aplicação no contexto organizacional e empresarial, dando continuidade ao desenvolvimento do projeto interdisciplinar.\n","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","23/06/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","Começo do projeto Marvel, disciplinas integradas. A  história da Marvel.\nEditora de quadrinhos a gigante do entretenimento.\n\nA Marvel é uma das marcas de entretenimento mais famosas e valiosas do mundo. Conhecida por seus super-heróis, histórias em quadrinhos, filmes, séries e produtos licenciados, a empresa conquistou milhões de fãs em diversos países. Sua trajetória é marcada por criatividade, inovação e pela criação de personagens que se tornaram ícones da cultura popular.\n\nComo tudo começou: A história da Marvel começou em 1939, quando o empresário Martin Goodman fundou a editora Timely Comics em Nova York, nos Estados Unidos.\nNaquela época, os quadrinhos estavam se tornando muito populares. A editora publicou histórias de aventura, ficção científica e super-heróis. Entre seus primeiros sucessos estavam o Tocha Humana Original e o Namor, conhecidos como alguns dos primeiros heróis da empresa.\nDurante a segunda guerra mundial, surgiu o Capitão América, que rapidamente se tornou um símbolo de coragem e patriotismo.\n\nA Era de ouro da criatividade: Nos anos 1960, a empresa passou por uma grande transformação. Sob a liderança de Stan Lee, acompanhado dos desenhistas Jack Kirby e Steve Ditko, foram criados personagens que mudaram a história dos quadrinhos. \n\nAntes disso, muitos heróis eram retratados como perfeitos. A Marvel ao criar personagens com problemas reais, inseguranças e dificuldades do dia a dia.\n\nFoi nesse período que surgiram:\n- QUARTETO FANTÁSTICO\n- HOMEM- ARANHA\n- HULK\n- THOR\n- HOMEM DE FERRO\n- X-MAN\n- DOUTOR ESTRANHO\nEsses personagens ajudaram a tornar a Marvel uma das editoras mais importantes do mundo.","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","19/06/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","entrega de boletins, conforme calendário","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","16/06/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","Continuação : Na aula de hoje, os estudantes iniciaram o desenvolvimento do Projeto Integrador, tendo como tema o universo da Marvel. A atividade tem como objetivo articular conhecimentos das disciplinas de Gestão de Pessoas, Marketing, Gestão da Qualidade e Empreendedorismo. Organizados em grupos, os alunos começaram a planejar a criação de uma história em quadrinhos autoral, definindo personagens, enredo e proposta central. Durante o processo, foram orientados a aplicar conceitos como trabalho em equipe, liderança, estratégias de divulgação, qualidade nas ações e inovação na resolução de problemas. A atividade terá continuidade nas próximas aulas, com o desenvolvimento e finalização das histórias.\n","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","10/06/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","Atividade Prática – Análise Jurídica do Registro de Marca (Simulação INPI)\n\nDando continuidade ao Projeto Integrador, os estudantes participarão de uma nova etapa prática, voltada à análise jurídica do registro fictício de marca realizado pelas equipes.\n\nNesta fase, os grupos que não participaram da criação das marcas assumirão o papel de analistas do Instituto Nacional da Propriedade Industrial (INPI), sendo responsáveis por avaliar os pedidos de registro apresentados anteriormente.\n\nA atividade consistirá na realização de pesquisas orientadas sobre os critérios legais exigidos para o registro de marcas no Brasil, tais como: originalidade do nome, inexistência de conflito com marcas já registradas, adequação à legislação vigente e respeito às normas de propriedade intelectual.\n\nCom base nessas informações, cada grupo deverá analisar uma ou mais marcas desenvolvidas por outras equipes, verificando se o pedido seria deferido (aprovado) ou indeferido (reprovado), apresentando justificativas fundamentadas em critérios jurídicos.\n\nDurante o processo, os alunos deverão:\n\n* Pesquisar no banco de dados de marcas para verificar possíveis registros semelhantes;\n* Avaliar a viabilidade legal do nome, logotipo e segmento de atuação;\n* Identificar possíveis conflitos ou irregularidades;\n* Elaborar um parecer técnico simulando a decisão do INPI.\n\nAo final da atividade, os grupos apresentarão suas análises jurídicas, explicando os motivos da aprovação ou reprovação da marca avaliada. A socialização das decisões permitirá o debate entre as equipes, promovendo a reflexão crítica sobre a importância da legalidade, da identidade empresarial e da proteção da marca no contexto empreendedor.\n\nEssa etapa contribui para o desenvolvimento do pensamento analítico, da argumentação e da compreensão dos processos legais envolvidos na formalização de empresas.\n","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","03/06/2026","Resources/PortalProfessor/selectRow.png","1"," 1 aula(s)","Desenvolvimento da Proposta\n\nDando continuidade ao Projeto Integrador desenvolvido nas disciplinas de Marketing, Gestão de Pessoas, Gestão da Qualidade e Empreendedorismo, os estudantes participaram de uma atividade investigativa na sala de informática, voltada ao processo de registro de marca, patente e abertura de empresa.\n\nInicialmente, foi realizada uma conversa orientada sobre a importância da identidade empresarial, da proteção de marcas e da inovação no mercado de trabalho. Em seguida, os grupos acessaram sites de pesquisa e plataformas oficiais para verificar se a marca criada anteriormente possuía disponibilidade para registro, analisando possíveis semelhanças com marcas já existentes.\n\nOs estudantes também pesquisaram informações relacionadas à abertura de empresas, como tipos de empresas, documentação necessária e etapas do processo de formalização de um negócio. Durante a atividade, os grupos registraram suas descobertas, dificuldades e possibilidades encontradas para a legalização da marca e da empresa criada.\n\nPosteriormente, a atividade foi continuada em sala de aula por meio de um debate, no qual os grupos puderam discutir suas experiências, compartilhar desafios encontrados durante a pesquisa e refletir sobre a importância da formalização de um empreendimento no mercado atual. Esse momento contribuiu para o desenvolvimento do pensamento crítico e da argumentação dos estudantes.\n\nAo final, cada equipe apresentou os resultados da pesquisa, expondo suas conclusões sobre a viabilidade do registro da marca e os passos necessários para transformar a ideia desenvolvida em um empreendimento formal.\n\n**Recursos Utilizados**\n\n* Sala de informática\n* Computadores com acesso à internet\n* Sites oficiais de consulta de marcas e empresas\n* Material de apoio e orientações do professor\n\n**Habilidades Desenvolvidas**\n\n* Pesquisa e análise de informações\n* Pensamento crítico e empreendedor\n* Trabalho em equipe\n* Planejamento empresarial\n* Comunicação e argumentação\n","Resources/ActionUpdateDisabled.png","Resources/excluir.png"],["1828","01/06/2026","Resources/PortalProfessor/selectRow.png","1"," 2 aula(s)","ATIVIDADE PRÁTICA PROJETO I","Resources/ActionUpdateDisabled.png","Resources/excluir.png"]]'></td></tr></tbody></table><div class="TextBlock"  style=";display:none;"  id="JSSCRIPT" >Text Block</div><script type="text/javascript">gx.dom.setAttribute("JSSCRIPT","gxformat","1");</script><span onclick="gx.evt.doClick('BUTTON1', event)"  class="BaseRBtn RButton" ><span class="BtnLeft"><span class="BtnRight"><span class="BtnBackground"><input type="button" name="BUTTON1" value="Fechar" title="Fechar" class="BtnText"  onclick="if( gx.evt.jsEvent(this)) {gx.evt.setGridEvt( 41,null);gx.fn.closeWindow();return false;} else return false;"   onfocus="gx.evt.onfocus(this, 51,'',false,'',0)"></span></span></span></span></td></tr></
